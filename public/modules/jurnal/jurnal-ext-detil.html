<template id="tpl-detil-balance">
	<div style="grid-row: 12; grid-column: 1 / span 6; padding: 0">
		<div class="formdetil-current-balance">
			<div style="justify-self: start; margin-right: auto;">
				<span id="balance-invalid" class="hidden">
					<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; color: rgb(153, 27, 27);">
						<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
						<line x1="12" y1="9" x2="12" y2="13"></line>
						<line x1="12" y1="17" x2="12.01" y2="17"></line>
					</svg>
				</span>
				<span id="balance-valid" class="hidden">
					<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; color: rgb(22, 163, 74);">
						<circle cx="12" cy="12" r="10"></circle>
						<polyline points="7 12 10 15 17 8"></polyline>
					</svg>
				</span>
			</div>
			<div style="font-weight: bold;">Current Balance</div>
			<div id="jurnalDetilEdit-balance_value" style="font-weight: bold; width: 100px; text-align: right;">0</div>
			<div id="jurnalDetilEdit-balance_idr" style="font-weight: bold; width: 100px; text-align: right;">0</div>
		</div>
	</div>
</template>
