<div style="display: flex; justify-content: space-between;">
	<div id="doc-logo"></div>
	<div id="doc-title">Jurnal Voucher</div>
</div>


<div id="doc-boundary">

	<div id="doc-header">
		
		<div data-label style="grid-row: 1; grid-column: 1">ID</div>
		<div data-value style="grid-row: 1; grid-column: 2 / span 2">{{jurnal_doc}}</div>
		<div data-value style="grid-row: 1; grid-column: 4; border-bottom: 0">/ {{jurnal_version}}</div>
		<div data-label style="grid-row: 1; grid-column: 5">Book Date</div>
		<div data-value style="grid-row: 1; grid-column: 6">{{jurnal_date}}</div>
		
		<div data-label class="prn-tbl-label" style="grid-row: 2; grid-column: 1">Descr</div>
		<div data-value style="grid-row: 2; grid-column: 2 / span 5">{{jurnal_descr}}</div>

	</div>

	<div style="padding: 0 3mm 0 1mm">
		<table id="doc-table" class="tableitem" cellpadding="0" cellspacing="0">
			<thead id="doc-table-header">
				<tr>
					<th name="no" class="rowheader">No</td>
					<th name="descr" class="rowheader">Descr</td>
					<th name="value" class="rowheader">Value</td>
					<th name="curr" class="rowheader">&nbsp;</td>
					<th name="idr" class="rowheader">IDR</td>
				</tr>
			</thead>

			<tbody id="doc-table-body">
				<tr>
					<td name="no">{{no}}</td>
					<td name="descr">{{jurnaldetil_descr}}</td>
					<td name="value">{{jurnaldetil_value}}</td>
					<td name="curr">{{curr_id}}</td>
					<td name="idr">{{jurnaldetil_idr}}</td>
				</tr>
			</tbody>
		</table>
	</div>



	<div id="doc-footer">


		<div id="doc-sign">
			<div data-signbox>
				<div data-caption>Dibuat Oleh</div>
				<div data-title></div>
				<div data-sign></div>
				<div data-signname>{{dibuat_nama}}</div>
			</div>

			<div data-signbox>
				<div data-caption>Diposting Oleh</div>
				<div data-title></div>
				<div data-sign></div>
				<div data-signname></div>
			</div>
		</div>

	</div>

</div>
