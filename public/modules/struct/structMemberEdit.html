<div id="structMemberEdit-head">
	<div id="structMemberEdit-head-title" class="section-detil-title"></div>
	<div id="structMemberEdit-head-descr" class="section-detil-descr"></div>
</div>

<form id="structMemberEdit-frm" class="module-form" locked="true" autoid="true" primarykey="structMemberEdit-obj_structmember_id">

	<!-- Textbox: structmember_id-->	
	<div id="structMemberEdit-obj_structmember_id-container" class="input-field hidden" field="structMemberEdit-obj_structmember_id">
		<label for="structMemberEdit-obj_structmember_id">ID</label>
		<input id="structMemberEdit-obj_structmember_id"  fgta5-component="Textbox" placeholder="user_id" autocomplete="off" spellcheck="false" 
			binding="structmember_id"
			data-tabindex="1" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Combobox: user_id-->	
	<div id="structMemberEdit-obj_user_id-container" class="input-field" field="structMemberEdit-obj_user_id">
		<label for="structMemberEdit-obj_user_id">User</label>
		<input id="structMemberEdit-obj_user_id"  fgta5-component="Combobox" placeholder="user" autocomplete="off" spellcheck="false" 
			binding="user_id"
			data-tabindex="2" 
			required 
			invalid-message-required="user harus diisi" 
			data-display="user_fullname" 
		>
	</div>


	<!-- Checkbox: issuspend-->	
	<div id="structMemberEdit-obj_issuspended-container" class="input-field" field="structMemberEdit-obj_issuspended">
		<label for="structMemberEdit-obj_issuspended">Suspend</label>
		<input id="structMemberEdit-obj_issuspended"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="issuspend"
			data-tabindex="3" 
			type="checkbox" 
		>
	</div>


	<!-- Textbox: struct_id-->	
	<div id="structMemberEdit-obj_struct_id-container" class="input-field hidden hidden" field="structMemberEdit-obj_struct_id">
		<label for="structMemberEdit-obj_struct_id">ID</label>
		<input id="structMemberEdit-obj_struct_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="struct_id"
			data-tabindex="4" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
			disabled 
		>
	</div>
	


	<div id="structMemberEdit-footer"></div>

</form>



<div class="panel-recordbar" data-view="nodetil">
	<div><a id="structMember-btn_recordstatus" href="javascript:void(0)" tabindex="-1">Record Status</a></div>
	<div><a id="structMember-btn_logs" href="javascript:void(0)" tabindex="-1">Logs</a></div>
</div>


<div class="footer-buttons-container hidden">
	<div>
		<button id="structMemberEdit-btn_prev"><span>&laquo;&laquo;</span></button>
	</div>
	<div>
		<button id="structMemberEdit-btn_save">Save</button>
		<button id="structMemberEdit-btn_edit">Edit</button>
		<button id="structMemberEdit-btn_new" data-action="structMember-addrow">New</button>
		<button id="structMemberEdit-btn_reset">Reset</button>
		<button id="structMemberEdit-btn_delete">Delete</button>
	</div>
	<div>
		<button id="structMemberEdit-btn_next"><span>&raquo;&raquo;</span></button>
	</div>
</div>
