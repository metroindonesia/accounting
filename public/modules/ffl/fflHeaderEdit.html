<form id="fflHeaderEdit-frm" class="module-form" locked="true" autoid="true"
	primarykey="fflHeaderEdit-obj_ffl_id">
	

		<!-- Textbox: ffl_id-->
		<div id="fflHeaderEdit-obj_ffl_id-container" class="input-field" field="fflHeaderEdit-obj_ffl_id">
			<label for="fflHeaderEdit-obj_ffl_id">
				Ffl_id
			</label>
			<input id="fflHeaderEdit-obj_ffl_id" fgta5-component="Textbox"
				placeholder="ffl_id" autocomplete="off" spellcheck="false"
				binding="ffl_id" 
			data-tabindex="1"
				
			autocomplete="off" spellcheck="false"
				
			maxlength="30"
				
					>
		</div>
		

		<!-- Textbox: ffl_descr-->
		<div id="fflHeaderEdit-obj_ffl_descr-container" class="input-field" field="fflHeaderEdit-obj_ffl_descr">
			<label for="fflHeaderEdit-obj_ffl_descr">
				Ffl_descr
			</label>
			<input id="fflHeaderEdit-obj_ffl_descr" fgta5-component="Textbox"
				placeholder="ffl_descr" autocomplete="off" spellcheck="false"
				binding="ffl_descr" 
			data-tabindex="2"
				
			autocomplete="off" spellcheck="false"
				
			maxlength="30"
				
					>
		</div>
		
</form>


<div id="fflHeaderEdit-footer">
</div>

						Detil

				<div id="panel-detil-additionalinfo">

	</div>
</div>

</div>

		</div>
		<div><a id="fflHeader-btn_logs" href="javascript:void(0)" tabindex="-1">Logs</a></div>

</div>

			</span>
			<span class="action-button-text">SAVE</span>
		</button>

		<button id="fflHeaderEdit-btn_edit" class="action-button button-edit">

		</button>

		<button id="fflHeaderEdit-btn_new" class="action-button button-new"  data-action="fflHeader-new">

		<button id="fflHeaderEdit-btn_reset" class="action-button button-reset">

		<button id="fflHeaderEdit-btn_delete" class="action-button button-delete">

	</div>

	<div>
		<button id="fflHeaderEdit-btn_next" class="action-button button-next">

		</button>
	</div>
</div>
