<form id="poHeaderEdit-frm" class="module-form" locked="true" autoid="true" primarykey="poHeaderEdit-obj_po_id">

	<!-- Textbox: po_id-->	
	<div id="poHeaderEdit-obj_po_id-container" class="input-field" field="poHeaderEdit-obj_po_id">
		<label for="poHeaderEdit-obj_po_id">ID</label>
		<input id="poHeaderEdit-obj_po_id"  fgta5-component="Textbox" placeholder="po_id" autocomplete="off" spellcheck="false" 
			binding="po_id"
			data-tabindex="1" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: po_doc-->	
	<div id="poHeaderEdit-ID-container" class="input-field" field="poHeaderEdit-ID">
		<label for="poHeaderEdit-ID">ID</label>
		<input id="poHeaderEdit-ID"  fgta5-component="Textbox" placeholder="order number" autocomplete="off" spellcheck="false" 
			binding="po_doc"
			data-tabindex="2" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: po_descr-->	
	<div id="poHeaderEdit-obj_po_descr-container" class="input-field" field="poHeaderEdit-obj_po_descr">
		<label for="poHeaderEdit-obj_po_descr">Descr</label>
		<input id="poHeaderEdit-obj_po_descr"  fgta5-component="Textbox" placeholder="pos_descr" autocomplete="off" spellcheck="false" 
			binding="po_descr"
			data-tabindex="3" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>
	
</form>


<div id="poHeaderEdit-footer">
</div>

<div id="panel-detil-selector" class="panel-detil hidden">
	<div panel-title>
		Information Detil
	</div>
	<div panel-content>

		<div id="panel-detil-additionalinfo">
			<!-- tambahkan additional info disini -->
		</div>
	</div>
</div>
 
<div id="poHeaderEdit-panelaction" class="panel-action hidden"></div>


<div class="panel-recordbar" data-view="nodetil">
	<div><a id="poHeader-btn_recordstatus" href="javascript:void(0)" tabindex="-1">Record Status</a></div>
	<div><a id="poHeader-btn_logs" href="javascript:void(0)" tabindex="-1">Logs</a></div>
	<div><a id="poHeader-btn_about" href="javascript:void(0)" tabindex="-1">About</a></div>
</div>


<div class="footer-buttons-container hidden">
	<div>
		<button id="poHeaderEdit-btn_prev" class="action-button button-prev">
			<span class="action-button-icon">◀</span>
			<span class="action-button-text">PREV</span>
		</button>
	</div>
	<div style="display: flex; column-gap: 5px; align-items: center;">

		<button id="poHeaderEdit-btn_save" class="action-button button-save">
			<span class="action-button-icon">
				<img src="public/icons/button-save.svg">
			</span>
			<span class="action-button-text">SAVE</span>
		</button>

		<button id="poHeaderEdit-btn_edit" class="action-button button-edit">
			<span class="action-button-icon">
				<img src="public/icons/button-locked.svg">
			</span>
			<span class="action-button-text">Edit</span>	
		</button>

		<button id="poHeaderEdit-btn_new" class="action-button button-new" data-action="poHeader-new">
			<span class="action-button-icon">
				<img src="public/icons/button-new.svg">
			</span>
			<span class="action-button-text">New</span>
		</button>


		<button id="poHeaderEdit-btn_reset" class="action-button button-reset" >
			<span class="action-button-icon">
				<img src="public/icons/button-reset.svg">
			</span>
			<span class="action-button-text">Reset</span>
		</button>

		<button id="poHeaderEdit-btn_delete" class="action-button button-delete" >
			<span class="action-button-icon">
				<img src="public/icons/button-delete.svg">
			</span>
			<span class="action-button-text">Delete</span>
		</button>
	</div>
	<div>
		<button id="poHeaderEdit-btn_next" class="action-button button-next">
			<span class="action-button-icon">▶</span>
			<span class="action-button-text">NEXT</span>
		</button>
	</div>
</div>
