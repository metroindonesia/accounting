<div class="container">

	<div class="box-image" style="justify-self: right">
		<img src="/public/images/kalista-accounting-400x170.svg" style="width: 150px; height: 63px;">
	</div>
	<div class="box-image" style="justify-self: left">
		<img src="/public/local/logo-128x32.svg" style="width: 252px; height: 55px;">
	</div>

	<div class="loginbox">
		<h1>Sign In</h1>
		<div>
			<input type="text" id="obj_username" placeholder="username" autocomplete="off">
		</div>
		<div class="password-container">
			<input type="password" id="obj_password" placeholder="password" autocomplete="off">
			<span id="btn_show_password" class="toggle-password">👁️</span>
		</div>
		<div>
			<button id="btn_login">Login</button>
		</div>
	</div>
</div>
