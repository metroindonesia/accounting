<!-- 
manual format excel:
https://github.com/linways/table-to-excel 
-->

<div id="print-area">

	<div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
		<div>
			<div id="judul-laporan">Laporan Cashflow</div>
			<div id="subjudul-laporan"></div>
			<div id="tgl_cetak" style="margin-bottom:15px;"></div>
		</div>
		<div id="report-logo"></div>
	</div>

	<table id="tbl-report" width="100%" data-cols-width="5,20,8,8,8,8,8,8,8,8,8,8">
		<thead>
			<tr>
				<th data-colname="no">No</th>
				<th data-colname="activity">Activity</th>
				<th data-colname="coa_id">coa</th>
				<th data-colname="coa_name">Description</th>
				<th data-colname="value">JAN</th>
				<th data-colname="value">FEB</th>
				<th data-colname="value">MAR</th>
				<th data-colname="value">APR</th>
				<th data-colname="value">MEI</th>
				<th data-colname="value">JUN</th>
				<th data-colname="value">JUL</th>
				<th data-colname="value">AGS</th>
				<th data-colname="value">SEP</th>
				<th data-colname="value">OKT</th>
				<th data-colname="value">NOV</th>
				<th data-colname="value">DES</th>
			</tr>
		</thead>

		<tbody>
		</tbody>

		<tfoot>
			<tr>
				<td>
					<div id="tbl-infoloader" style="position: absolute;"><!-- Report Loader Info --></div>
				</td>
			</tr>
		</tfoot>
	</table>

	<template name="template-report-row">
		<tr data-rowblock="{{block}}">
			<td data-colname="rowid">{{rowid}}</td>
			<td data-colname="activity">{{activity_name}}</td>
			<td data-colname="coa_id">{{coa_id}}</td>
			<td data-colname="coa_name">{{coa_name}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{jan}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{feb}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{mar}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{apr}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{mei}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{jun}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{jul}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{ags}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{sep}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{okt}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{nov}}</td>
			<td data-colname="value" data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{des}}</td>
		</tr>
	</template>

</div>
