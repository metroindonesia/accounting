<!-- 
manual format excel:
https://github.com/linways/table-to-excel 
-->

<div id="print-area">

	<div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
		<div>
			<div id="judul-laporan">Laporan Aging</div>
			<div id="subjudul-laporan"></div>
			<div id="tgl_cetak" style="margin-bottom:15px;"></div>
		</div>
		<div id="report-logo"></div>
	</div>

	<table id="tbl-report" width="100%" data-cols-width="5,70,8,8,8,8,8,8,8">
		<thead>
			<tr>
				<th data-colname="no">No</th>
				<!-- <th data-colname="coa_id">Coa ID</th> -->
				<th data-colname="">Keterangan</th>
				<th data-colname="outstanding">Outst</th>
				<th>not yet due</th>
				<th>0-30</th>
				<th>31-60</th>
				<th>61-90</th>
				<th>91-120</th>
				<th>>120</th>
			</tr>
		</thead>

		<tbody>
		</tbody>

		<tfoot>
			<tr>
				<td>
					<div id="tbl-infoloader" style="position: absolute;"><!-- Report Loader Info --></div>
				</td>
			</tr>
		</tfoot>
	</table>

	<template name="template-report-row">
		<tr data-rowblock="{{block}}">
			<td data-colname="rowid">{{rowid}}</td>
			<!-- <td data-colname="coa_id">{{coa_id}}</td> -->
			<td data-colname="descr">{{descr}}</td>
			<td data-colname="outstanding" data-format="decimal" data-t="n" data-a-h="right"
				data-num-fmt="#,##0;#,##0;#,##0;@">{{outstanding_idr}}</td>
			<td data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{idr_due_000}}
			</td>
			<td data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{idr_due_030}}
			</td>
			<td data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{idr_due_060}}
			</td>
			<td data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{idr_due_090}}
			</td>
			<td data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{idr_due_120}}
			</td>
			<td data-format="decimal" data-t="n" data-a-h="right" data-num-fmt="#,##0;#,##0;#,##0;@">{{idr_due_999}}
			</td>
		</tr>
	</template>

</div>
