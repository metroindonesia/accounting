<form id="jurnalmodelHeaderEdit-frm" class="module-form" locked="true" autoid="false" primarykey="jurnalmodelHeaderEdit-obj_jurnalmodel_id">

	<!-- Textbox: jurnalmodel_id-->	
	<div id="jurnalmodelHeaderEdit-obj_jurnalmodel_id-container" class="input-field" field="jurnalmodelHeaderEdit-obj_jurnalmodel_id">
		<label for="jurnalmodelHeaderEdit-obj_jurnalmodel_id">ID</label>
		<input id="jurnalmodelHeaderEdit-obj_jurnalmodel_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="jurnalmodel_id"
			data-tabindex="1" 
			character-case="lowercase" 
			required 
			invalid-message-required="id model harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="16" 
		>
	</div>


	<!-- Textbox: jurnalmodel_name-->	
	<div id="jurnalmodelHeaderEdit-obj_jurnalmodel_name-container" class="input-field" field="jurnalmodelHeaderEdit-obj_jurnalmodel_name">
		<label for="jurnalmodelHeaderEdit-obj_jurnalmodel_name">Name</label>
		<input id="jurnalmodelHeaderEdit-obj_jurnalmodel_name"  fgta5-component="Textbox" placeholder="nama" autocomplete="off" spellcheck="false" 
			binding="jurnalmodel_name"
			data-tabindex="2" 
			required 
			invalid-message-required="nama jurnal model harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: jurnalmodel_descr-->	
	<div id="jurnalmodelHeaderEdit-obj_jurnalmodel_descr-container" class="input-field" field="jurnalmodelHeaderEdit-obj_jurnalmodel_descr">
		<label for="jurnalmodelHeaderEdit-obj_jurnalmodel_descr">Descr</label>
		<input id="jurnalmodelHeaderEdit-obj_jurnalmodel_descr"  fgta5-component="Textbox" placeholder="descr" autocomplete="off" spellcheck="false" 
			binding="jurnalmodel_descr"
			data-tabindex="3" 
			autocomplete="off" spellcheck="false" 
			maxlength="255" 
		>
	</div>


	<!-- Textbox: jurnalmodel_copyto-->	
	<div id="jurnalmodelHeaderEdit-obj_jurnalmodel_copyto-container" class="input-field" field="jurnalmodelHeaderEdit-obj_jurnalmodel_copyto">
		<label for="jurnalmodelHeaderEdit-obj_jurnalmodel_copyto">Copy To</label>
		<input id="jurnalmodelHeaderEdit-obj_jurnalmodel_copyto"  fgta5-component="Textbox" placeholder="jurnalmodel_copyto" autocomplete="off" spellcheck="false" 
			binding="jurnalmodel_copyto"
			data-tabindex="4" 
			autocomplete="off" spellcheck="false" 
			maxlength="1" 
			validator="valueIs:['K', 'D', '']" 
		>
	</div>
	
</form>
